# Monitoring & Observability Known Issues — InfraDx Knowledge Base
# schema version: 1
domain: server
os: linux

issues:

  - id: mon-prom-001
    title: Prometheus 타겟 스크래핑 실패 — 포트 불일치
    severity: high
    category: monitoring
    keywords: [prometheus, scrape, target, "connection refused", port, 스크래핑, 타겟다운, relabel]
    symptoms:
      - Prometheus UI의 Targets에서 특정 서비스가 DOWN
      - 오류 메시지에 잘못된 포트로의 "connection refused" (예: 8080 vs 실제 9090)
      - Grafana에서 해당 서비스 메트릭이 "No data"
    diagnosis_commands:
      - cmd: "curl http://localhost:9090/api/v1/targets | python3 -m json.tool | grep -A 5 'health.*down'"
        purpose: Prometheus API로 다운된 타겟 확인
      - cmd: "kubectl get pod <pod-name> -o yaml | grep -A 5 'annotations'"
        purpose: Pod의 prometheus.io/port 어노테이션 확인
      - cmd: "curl http://<pod-ip>:<port>/metrics | head -5"
        purpose: 실제 메트릭 엔드포인트 접근 가능 여부
    root_causes:
      - prometheus.io/port 어노테이션 값과 실제 애플리케이션 리스닝 포트 불일치
      - relabel_config의 정규식이 IP:PORT를 올바르게 조합하지 못해 기본 포트로 폴백
      - 서비스 업데이트 시 포트 변경됐지만 어노테이션 미수정
    fix:
      immediate:
        - "Pod 어노테이션 수정: kubectl annotate pod <pod> prometheus.io/port=<실제포트> --overwrite"
        - "Prometheus 설정 리로드: curl -X POST http://prometheus:9090/-/reload"
      permanent:
        - |
          relabel_config에서 __address__와 어노테이션 포트를 올바르게 조합:
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: ${1}:${2}
        - "Helm chart에서 serviceMonitor와 실제 포트를 함께 관리"
    diagnosis_hints:
      - "타겟 URL에 포트가 없거나 잘못된 포트가 보이면 relabel 또는 어노테이션 문제"
      - "Prometheus UI → Targets → 해당 타겟 클릭 시 실제 스크래핑 URL 확인 가능"
    prevention:
      - "Prometheus Targets 페이지 정기 점검"
      - "서비스 포트 변경 시 어노테이션/ServiceMonitor 동시 업데이트 체크리스트"

  - id: mon-alert-001
    title: AlertManager 알림 미발송 — Receiver 이름 불일치
    severity: high
    category: monitoring
    keywords: [alertmanager, alert, receiver, slack, "no matching receiver", 알림미발송, 수신자불일치]
    symptoms:
      - Prometheus에서 alert firing 상태이고 AlertManager UI에서도 보임
      - 실제 Slack/이메일 알림은 오지 않음
      - AlertManager UI에서 Receiver가 "<no matching receiver>" 표시
    diagnosis_commands:
      - cmd: "curl http://alertmanager:9093/api/v2/alerts | python3 -m json.tool | grep receiver"
        purpose: 현재 알림의 receiver 필드 확인
      - cmd: "cat /etc/alertmanager/alertmanager.yml | grep -E 'receiver:|name:'"
        purpose: route의 receiver 이름과 receivers의 name 비교
      - cmd: "curl -X POST http://alertmanager:9093/-/reload"
        purpose: 설정 변경 후 리로드
    root_causes:
      - route 설정의 receiver 이름과 receivers 블록의 name이 다름 (예: slack_warning vs slack-warning)
      - 언더스코어(_)와 하이픈(-) 혼용 오타
      - 설정 파일 수정 후 AlertManager 리로드 미실행
    fix:
      immediate:
        - "alertmanager.yml에서 route.receiver 값과 receivers[].name 값이 정확히 일치하는지 확인"
        - "수정 후 리로드: curl -X POST http://alertmanager:9093/-/reload (또는 kubectl rollout restart)"
      permanent:
        - "alertmanager.yml 수정 전 amtool config check로 설정 검증"
        - "receiver 이름을 kebab-case로 통일하는 컨벤션 적용"
    diagnosis_hints:
      - '"<no matching receiver>" → route에서 참조하는 이름과 receivers에 정의된 이름이 다름'
      - "AlertManager는 이름을 대소문자 구분하며 공백도 다르게 취급"
    prevention:
      - "alertmanager.yml 변경 시 CI에서 amtool config check 자동 실행"

  - id: mon-grafana-001
    title: Grafana 패널 "No data" — Prometheus 메트릭명 오류 (_total suffix 누락)
    severity: medium
    category: monitoring
    keywords: [grafana, "no data", promql, "_total", "metric name", 메트릭없음, 이름오류, prometheus]
    symptoms:
      - Grafana 특정 패널만 "No data" 표시 (다른 패널은 정상)
      - Prometheus에서 직접 조회 시 해당 메트릭명으로 결과 없음
      - Datasource 연결 자체는 정상
    diagnosis_commands:
      - cmd: "curl 'http://prometheus:9090/api/v1/query?query=<metric_name>' | python3 -m json.tool"
        purpose: Prometheus에서 메트릭명 직접 조회
      - cmd: "curl 'http://prometheus:9090/api/v1/label/__name__/values' | python3 -m json.tool | grep <partial_name>"
        purpose: 실제 존재하는 메트릭명 검색
    root_causes:
      - Counter 타입 메트릭은 Prometheus 규약상 _total 접미사 포함 (예: container_cpu_usage_seconds_total)
      - Grafana 대시보드 쿼리가 접미사 없는 이름을 사용 (예: container_cpu_usage_seconds)
      - Prometheus 버전 업 또는 exporter 업데이트로 메트릭명 변경
    fix:
      immediate:
        - "Grafana 패널 편집 → PromQL에 _total 추가"
        - |
          예시 수정:
          변경 전: rate(container_cpu_usage_seconds[5m]) * 100
          변경 후: rate(container_cpu_usage_seconds_total[5m]) * 100
      permanent:
        - "Prometheus UI에서 실제 메트릭명 확인 후 대시보드 저장"
        - "Grafana 대시보드를 코드로 관리 (grafonnet, grafana-dashboard-crd)"
    diagnosis_hints:
      - "다른 패널은 정상인데 특정 패널만 No data → 쿼리 문제 (Datasource 문제 아님)"
      - "Prometheus에서 rate()를 사용하는 메트릭은 거의 항상 _total Counter 타입"
      - "메트릭명 확인: Prometheus UI → Graph → metric explorer에서 자동완성"
    prevention:
      - "대시보드 임포트 후 모든 패널 정상 데이터 표시 확인"
      - "exporter 버전 업 시 메트릭명 변경 여부 릴리즈 노트 확인"
